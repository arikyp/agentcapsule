[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmcodec"
version = "0.1.0"
description = "Lossless byte transport through language-model-shaped text"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lmcodec = "lmcodec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

