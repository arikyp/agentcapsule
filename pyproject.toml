[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcapsule"
version = "0.1.0"
description = "Agent Capsule Protocol for inspectable text-native artifact transfer"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = [
    "agents",
    "ai-agents",
    "artifact-transfer",
    "protocol",
    "security",
    "provenance",
    "signatures",
    "base64",
    "governance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
agentcapsule = "agentcapsule.cli:main"
capsule = "agentcapsule.cli:main"

[project.optional-dependencies]
signing = ["cryptography>=46,<47"]

[project.urls]
Homepage = "https://github.com/arikyp/agentcapsule"
Repository = "https://github.com/arikyp/agentcapsule"
Issues = "https://github.com/arikyp/agentcapsule/issues"
Documentation = "https://github.com/arikyp/agentcapsule/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]
